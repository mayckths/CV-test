<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
/* A test page for the meadow hero (the portfolio's hero since 28 Nov 2026), with a switcher for eight backgrounds. */
html, body { height: 100%; overflow: hidden; }
/* The shared meadow styles, Studio and Night live in styles.css; the other six backgrounds are here. */
/* Clear day: pale blue sky down to a warm horizon, a white sun. */
.grow-layer[data-bg="sky"] { --bg: linear-gradient(#b7d6f4 0%, #d8e9f7 50%, #f7efe2 100%); --s1: rgba(255, 253, 238, .95); --s2: rgba(255, 244, 205, .35); --g1: rgba(255, 255, 255, .55); --g2: rgba(255, 255, 255, .16); }
/* Sunset poster: flat bands of colour, like the screen prints, with a low haze on the horizon. */
.grow-layer[data-bg="sunset"] { --bg: linear-gradient(#ffd7ad 0 30%, #ffc196 30% 46%, #ffa98c 46% 60%, #f99095 60% 73%, #ec7f9f 73% 86%, #dd76a6 86% 100%); --s1: rgba(255, 236, 170, .75); --s2: rgba(255, 214, 160, .3); --g1: rgba(255, 248, 226, .45); --g2: rgba(255, 238, 200, .12); }
/* Hot pink, from the art. */
.grow-layer[data-bg="pink"] { --bg: linear-gradient(#ff4d8f, #ff2e7e 60%, #f0246f); --s1: rgba(255, 200, 222, .75); --s2: rgba(255, 140, 185, .3); --g1: rgba(255, 236, 244, .45); --g2: rgba(255, 220, 236, .14); }
/* Holographic: pastel pink, lilac, cyan and butter. */
.grow-layer[data-bg="holo"] { --bg: linear-gradient(135deg, #ffd3ea 0%, #e2d3ff 32%, #c6efff 64%, #fff2c4 100%); --s1: rgba(255, 255, 255, .85); --s2: rgba(255, 255, 255, .3); --g1: rgba(255, 255, 255, .55); --g2: rgba(255, 255, 255, .16); }
/* Ultraviolet dusk: indigo into violet with a pink horizon; white type, pollen like fireflies. */
.grow-layer[data-bg="dusk"] { --bg: linear-gradient(#1a1466 0%, #34197a 40%, #7a3291 72%, #f06a95 100%); --s1: rgba(255, 140, 180, .55); --s2: rgba(180, 90, 200, .22); --g1: rgba(255, 210, 235, .22); --g2: rgba(255, 190, 225, .07); }

/* The background switcher (test page only). */
.bg-pick { position: fixed; z-index: 60; right: 16px; bottom: 16px; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(31, 28, 28, .82); backdrop-filter: blur(8px); font: 500 12px/1 var(--mono, monospace); letter-spacing: .06em; text-transform: uppercase; }
.bg-pick button { border: 0; border-radius: 999px; padding: 8px 11px; background: none; color: rgba(255, 255, 255, .62); font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
.bg-pick button[aria-pressed="true"] { background: #fff; color: #1f1c1c; }
@media (hover: hover) { .bg-pick button:hover { color: #fff; } .bg-pick button[aria-pressed="true"]:hover { color: #1f1c1c; } }
@media (max-width: 700px) {
  .bg-pick { left: 8px; right: 8px; bottom: 8px; overflow-x: auto; scrollbar-width: none; } .bg-pick button { flex: none; }
  .hero.grow > .hero-cue { bottom: 62px; } .hero.grow .lens-blurb { bottom: 128px; }
}
</style>

      <div class="grow-layer from" data-bg="studio" aria-hidden="true"><div class="grow-sun"></div><div class="grow-glow"></div></div>
