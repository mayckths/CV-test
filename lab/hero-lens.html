<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hero prototype · Hot pink lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* A prototype of the hero, not part of the portfolio yet. The hero exists twice, one on top of the other: a grey one
   and a hot pink one. The pink one is only shown inside a lens that follows the cursor, and the lens has no hard
   edge: it breaks up into square pixels, some of them in the palette's colours. Behind it all, fine dust drifts in
   slow bands and parts around the lens. */
:root { --page:#f5ebe3; --gap:16px; --r:28px; --grey:#eceae6; --ink:#232125; --pink:#ff2e7e; --navy:#1a1466; --cyan:#2de2e6;
  --display:"Bricolage Grotesque", sans-serif; --text:"Geist", sans-serif; --mono:"Geist Mono", monospace; --serif:"Instrument Serif", serif; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; background:var(--page); font-family:var(--text); -webkit-font-smoothing:antialiased; overflow:hidden; }
.top { position:fixed; top:calc(var(--gap) + 12px); left:50%; transform:translateX(-50%); z-index:9; display:flex; gap:8px; align-items:center; white-space:nowrap; pointer-events:none; }
.island { display:flex; align-items:center; gap:6px; padding:6px 6px 6px 16px; border-radius:999px; background:rgba(31,28,28,.82); color:rgba(241,238,253,.62); font-size:14px; }
.island svg { height:15px; fill:#fff; margin-right:10px; } .island span { padding:9px 13px; }
.hi { display:inline-flex; align-items:center; height:48px; padding:0 20px; border-radius:999px; background:#fff; color:#1f1c1c; font-weight:600; font-size:14px; box-shadow:0 8px 22px -12px rgba(31,28,28,.55); }
.panel { position:absolute; inset:var(--gap); border-radius:var(--r); overflow:hidden; touch-action:pan-y; background:var(--grey); }
.sc { position:absolute; inset:0; overflow:hidden; }
.sc.grey { background:var(--grey); color:var(--ink); --two:var(--ink); --num:var(--ink); }
.sc.pink { background:var(--pink); color:#fff; --two:var(--navy); --num:var(--navy); }
canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.run { position:absolute; left:56px; right:56px; top:100px; display:flex; align-items:center; gap:18px; font:500 12px/1.4 var(--mono); letter-spacing:.14em; text-transform:lowercase; }
.rule { flex:1; height:1px; background:currentColor; opacity:.32; position:relative; } .rule::after { content:""; position:absolute; left:62%; top:-9px; width:1px; height:19px; background:currentColor; } .rule.b::after { left:28%; }
.hl { position:absolute; top:17%; font:800 min(11.2vw, 21vh)/.8 var(--display); letter-spacing:-.06em; white-space:nowrap; }
.hl.a { right:calc(50% + .12em); } .hl.b { left:calc(50% + .12em); font:400 italic 1.035em/.8 var(--serif); font-size:min(11.6vw, 21.7vh); letter-spacing:-.03em; color:var(--two); }
.blurb { position:absolute; left:56px; bottom:38px; font-size:17px; line-height:1.45; max-width:31ch; } .blurb b { font-weight:600; }
.list { position:absolute; right:56px; bottom:38px; width:270px; list-style:none; font-size:15px; } .list li { display:grid; grid-template-columns:30px 1fr; padding:7px 0; border-top:1px solid color-mix(in srgb, currentColor 30%, transparent); } .list span { font:400 italic 19px/1 var(--serif); color:var(--num); }
.cue { position:absolute; left:50%; bottom:26px; transform:translateX(-50%); z-index:3; display:inline-flex; align-items:center; gap:10px; height:44px; padding:0 6px 0 16px; border-radius:999px; border:1px solid #fff; color:#fff; mix-blend-mode:difference; font:500 12px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; pointer-events:none; }
.cue i { width:32px; height:32px; border-radius:50%; background:#fff; display:grid; place-items:center; } .cue i::after { content:"↓"; font:600 15px/1 var(--text); color:#000; }
@media (max-width:700px) {
  :root { --gap:10px; --r:22px; }
  .island { font-size:12.5px; padding:5px 5px 5px 10px; gap:0; } .island span { padding:8px 6px; } .island svg { height:13px; margin-right:4px; } .hi { height:44px; padding:0 13px; font-size:13px; }
  .run { left:22px; right:22px; top:84px; gap:10px; } .run .mid { display:none; }
  .hl { top:15.5%; font-size:23.5vw; } .hl.a { right:auto; left:20px; } .hl.b { left:22px; top:calc(15.5% + 20vw); font-size:24.5vw; }
  .blurb { left:22px; right:22px; bottom:84px; max-width:none; font-size:16.5px; } .list { display:none; }
}
</style>
</head>
<body>
<div class="top" aria-hidden="true"><div class="island"><svg viewBox="0 0 44 20"><path d="M0 20L11 0L22 20ZM22 20L33 0L44 20Z"/></svg><span>About</span><span>Work</span><span>Experience</span><span>Art</span><span>Ask</span></div><div class="hi">Say hi</div></div>
<main class="panel" id="panel">
  <div class="sc grey"><canvas class="fx"></canvas><div class="copy"></div></div>
  <div class="sc pink" aria-hidden="true"><canvas class="fx"></canvas><div class="copy"></div></div>
  <canvas class="px"></canvas>
  <div class="cue" aria-hidden="true">Scroll<i></i></div>
</main>
<template id="copy">
  <div class="run"><span>mayck cuellar</span><i class="rule b"></i><span class="mid">vol. 11 · 2015–2026</span><i class="rule mid"></i><span>selected works</span></div>
  <h1 class="hl a">Product</h1><h1 class="hl b">Designer</h1>
  <p class="blurb"><b>10+ years</b> across fintech and consumer products for <b>Novo</b>, <b>Google</b>, <b>Logitech G</b> and <b>AccuWeather</b>, from discovery to launch.</p>
  <ol class="list"><li><span>1</span>AI Assistant</li><li><span>2</span>Logitech G audio mixer</li><li><span>3</span>With Google Built-in Auto</li><li><span>4</span>AccuWeather app</li></ol>
</template>
<script>
(() => {
  const panel = document.getElementById("panel"), pink = panel.querySelector(".sc.pink");
  panel.querySelectorAll(".copy").forEach((c) => c.replaceWith(document.getElementById("copy").content.cloneNode(true)));
  const fxA = panel.querySelector(".grey .fx"), fxB = panel.querySelector(".pink .fx"), pxC = panel.querySelector(".px");
  const a = fxA.getContext("2d"), b = fxB.getContext("2d"), px = pxC.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const COLOURS = ["#ff2e7e", "#1a1466", "#2de2e6", "#ffffff", "#ff2e7e", "#1a1466"];
  const hash = (x, y) => { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

  let W = 0, H = 0, dpr = 1, cell = 26, cols = 0, rows = 0, heat = new Float32Array(0), phone = false;
  let R0 = 200, R1 = 320, dust = [], motes = [], pyr = { cx: 0, base: 0, a: 0, h: 0 };
  const lens = { x: 0, y: 0, tx: 0, ty: 0, seen: 0, on: false };

  function build() {
    const r = panel.getBoundingClientRect();
    W = r.width; H = r.height; phone = W < 700; dpr = Math.min(window.devicePixelRatio || 1, 1.5);   // the dust is soft enough not to need more
    for (const c of [fxA, fxB, pxC]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    cell = phone ? 17 : Math.max(20, Math.round(W / 54));
    cols = Math.ceil(W / cell); rows = Math.ceil(H / cell); heat = new Float32Array(cols * rows);
    R0 = phone ? W * 0.3 : Math.min(W, H) * 0.25; R1 = R0 * 1.6;
    // Two square pyramids side by side (an M), as points in space: 40% on the edges, the rest on the faces.
    const wp = phone ? W * 0.78 : Math.min(W * 0.31, H * 0.56), pa = wp / 4, ph = wp * 0.6;
    pyr = { cx: W / 2, base: phone ? H * 0.66 : H * 0.74, a: pa, h: ph };
    motes = [];
    const n = phone ? 1900 : 3600, corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
    for (let i = 0; i < n; i++) {
      const side = i % 2 ? 1 : -1; let x, y, z;
      if (i % 5 < 2) {
        const k = (Math.random() * 4) | 0, c0 = corners[k], c1 = corners[(k + 1) % 4], u = Math.random();
        if (Math.random() < 0.6) { x = c0[0] * pa * (1 - u); z = c0[1] * pa * (1 - u); y = ph * u; }
        else { x = (c0[0] + (c1[0] - c0[0]) * u) * pa; z = (c0[1] + (c1[1] - c0[1]) * u) * pa; y = 0; }
      } else {
        const k = (Math.random() * 4) | 0, c0 = corners[k], c1 = corners[(k + 1) % 4]; let u = Math.random(), v = Math.random(); if (u + v > 1) { u = 1 - u; v = 1 - v; }
        x = (c0[0] * u + c1[0] * v) * pa; z = (c0[1] * u + c1[1] * v) * pa; y = ph * (1 - u - v);
      }
      const free = Math.random() < 0.18, s = Math.random();
      motes.push({ x: x + side * pa, y, z, free, fx: (Math.random() * 2 - 1) * wp * 0.95, fy: (Math.random() * 2 - 1) * ph * 0.9 + ph * 0.45, seed: Math.random() * 6.283, size: 1.5 + 3.4 * Math.pow(s, 3), alpha: 0.7 + 0.3 * Math.random() });
    }
    // Dust: grains that ride four slow wavy bands across the panel.
    const bands = [[0.16, 0.045, 1.1, 0.4, 0.05], [0.4, 0.06, 0.8, 2.1, 0.07], [0.63, 0.05, 1.3, 4.0, 0.085], [0.86, 0.04, 0.9, 0.9, 0.075]];
    dust = [];
    const dn = phone ? 2000 : 4200, gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
    for (let i = 0; i < dn; i++) dust.push({ band: bands[(Math.random() * 4) | 0], u: Math.random(), off: gauss(), speed: 0.004 + 0.008 * Math.random(), ox: 0, oy: 0, size: Math.random() < 0.82 ? 1 : 2, alpha: 0.22 + 0.7 * Math.pow(Math.random(), 2) });
    dust.sort((p, q) => p.alpha - q.alpha);
    if (!lens.on) { lens.x = lens.tx = W / 2; lens.y = lens.ty = H * 0.52; }
  }

  // The lens follows the pointer. Left alone (or on a phone, between touches) it wanders slowly around the pyramids.
  const point = (e) => { const r = panel.getBoundingClientRect(); lens.tx = e.clientX - r.left; lens.ty = e.clientY - r.top; lens.seen = performance.now(); lens.on = true; };
  panel.addEventListener("pointermove", point); panel.addEventListener("pointerdown", point);
  panel.addEventListener("pointerleave", () => { lens.seen = 0; });

  let last = performance.now(), t = 0, clip = "", raf = 0;
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!reduced) t += dt;
    if (now - lens.seen > 2200 && !reduced) { lens.tx = W / 2 + Math.cos(t * 0.42) * W * (phone ? 0.2 : 0.17); lens.ty = H * (phone ? 0.5 : 0.52) + Math.sin(t * 0.63) * H * 0.13; }
    const ease = 1 - Math.exp(-dt * (now - lens.seen > 2200 ? 2.2 : 9));
    lens.x += (lens.tx - lens.x) * ease; lens.y += (lens.ty - lens.y) * ease;

    // 1. The lens as cells. Inside it every cell shows; across its edge fewer and fewer do, in the order of a Bayer
    //    matrix; and a cell the lens has just left stays for a moment, so the lens trails a few pixels behind it.
    px.setTransform(dpr, 0, 0, dpr, 0, 0); px.clearRect(0, 0, W, H);
    const tick = Math.floor(t * 3); let d = "";
    for (let y = 0; y < rows; y++) {
      let start = -1;
      for (let x = 0; x <= cols; x++) {
        let show = false;
        if (x < cols) {
          const i = y * cols + x, cxp = (x + 0.5) * cell, cyp = (y + 0.5) * cell;
          const dist = Math.hypot(cxp - lens.x, cyp - lens.y), k = (dist - R0) / (R1 - R0), bay = (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
          const inside = k <= 0 || (k < 1 && bay > k);
          heat[i] = inside ? 1 : Math.max(0, heat[i] - dt * 1.7);
          show = inside || heat[i] > 0.3 + 0.65 * bay;
          // Coloured pixels: thick in the edge, thinning outwards, a few just inside it, and in the trail.
          const h1 = hash(x * 31 + tick * ((i % 7) + 1), y * 17 + ((i * 13) % 5)), h2 = hash(x + 91, y + 57 + tick);
          let p = 0;
          if (!show) p = k < 1 ? 0.5 * (1 - k) + 0.07 : k < 1.75 ? 0.1 * (1.75 - k) / 0.75 : 0, p = Math.max(p, heat[i] * 0.45);
          else if (k > -0.22) p = 0.09;
          if (p && h1 < p) { px.fillStyle = COLOURS[(h2 * COLOURS.length) | 0]; px.fillRect(x * cell, y * cell, cell, cell); }
        }
        if (show && start < 0) start = x;
        else if (!show && start >= 0) { d += `M${start * cell} ${y * cell}h${(x - start) * cell}v${cell}h${-(x - start) * cell}z`; start = -1; }
      }
    }
    if (d !== clip) { clip = d; pink.style.clipPath = d ? `path("${d}")` : "inset(100%)"; pink.style.webkitClipPath = pink.style.clipPath; }

    // 2. Dust and pyramids, drawn once in ink for the grey hero and copied in white for the pink one.
    a.setTransform(dpr, 0, 0, dpr, 0, 0); a.clearRect(0, 0, W, H); a.fillStyle = "#232125";
    const push = R0 * 0.55, reach = R1 * 0.95, k2 = 1 - Math.exp(-dt * 5);
    let alpha = -1;
    for (const g of dust) {
      const bd = g.band, u = (g.u + t * g.speed) % 1, x = u * (W + 40) - 20;
      const y = H * (bd[0] + bd[1] * Math.sin(bd[2] * 6.283 * u + bd[3] + t * 0.12) + 0.02 * Math.sin(5.1 * 6.283 * u + bd[3] * 2) + g.off * bd[4] * 0.5);
      const dx = x - lens.x, dy = y - lens.y, dist = Math.hypot(dx, dy) + 0.001, f = push * Math.exp(-(dist / reach) * (dist / reach));
      g.ox += (dx / dist * f - g.ox) * k2; g.oy += (dy / dist * f - g.oy) * k2;
      const q = Math.round(g.alpha * 8) / 8; if (q !== alpha) { alpha = q; a.globalAlpha = q; }
      a.fillRect(x + g.ox, y + g.oy, g.size, g.size);
    }
    // The pyramids turn a little with the lens, so they read as solids; each mote also drifts on its own small loop.
    const ang = ((lens.x - W / 2) / W) * 0.6, ca = Math.cos(ang), sa = Math.sin(ang), f = pyr.a * 9;
    for (const m of motes) {
      let X, Y, s = 1;
      if (m.free) { X = pyr.cx + m.fx + Math.sin(t * 0.3 + m.seed) * 14; Y = pyr.base - m.fy + Math.cos(t * 0.26 + m.seed * 1.7) * 12; }
      else { const xr = m.x * ca + m.z * sa, zr = -m.x * sa + m.z * ca; s = f / (f + zr); X = pyr.cx + xr * s + Math.sin(t * 0.55 + m.seed) * 1.6; Y = pyr.base - m.y * s + zr * 0.16 + Math.cos(t * 0.47 + m.seed) * 1.6; }
      a.globalAlpha = m.alpha; const r = m.size * s;
      if (r < 1.5) a.fillRect(X, Y, r, r); else { a.beginPath(); a.arc(X, Y, r * 0.62, 0, 6.283); a.fill(); }
    }
    a.globalAlpha = 1;
    b.setTransform(1, 0, 0, 1, 0, 0); b.globalCompositeOperation = "copy"; b.drawImage(fxA, 0, 0);
    b.globalCompositeOperation = "source-in"; b.fillStyle = "#fff"; b.fillRect(0, 0, fxB.width, fxB.height);
  }
  const start = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } };
  document.addEventListener("visibilitychange", () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else start(); });
  let rt = 0; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(build, 120); });
  build(); start();
  window.__lens = { lens, get cells() { return cols * rows; }, get clipLen() { return clip.length; } };
})();
</script>
</body>
</html>
