<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hero prototype · Hot pink blueprint lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* A prototype of the hero, not part of the portfolio yet. The hero exists twice, one on top of the other: a grey one
   and a hot pink one. The pink one is only shown inside a lens that follows the cursor, and the lens has no hard
   edge: it breaks up into square pixels, some of them in the palette's colours. One system of grains drifts in slow
   bands, gathers into the two pyramids and parts around the lens. Inside the lens the pyramids are shown as their
   blueprint, drawn in three dimensions: a floor grid, wireframes with hidden edges, heights, measurements and axes. */
:root { --page:#f5ebe3; --gap:16px; --r:28px; --grey:#eceae6; --ink:#232125; --pink:#ff2e7e; --navy:#1a1466; --cyan:#2de2e6;
  --display:"Bricolage Grotesque", sans-serif; --text:"Geist", sans-serif; --mono:"Geist Mono", monospace; --serif:"Instrument Serif", serif; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; background:var(--page); font-family:var(--text); -webkit-font-smoothing:antialiased; overflow:hidden; }
.top { position:fixed; top:calc(var(--gap) + 12px); left:50%; transform:translateX(-50%); z-index:9; display:flex; gap:8px; align-items:center; white-space:nowrap; pointer-events:none; }
.island { display:flex; align-items:center; gap:6px; padding:6px 6px 6px 16px; border-radius:999px; background:rgba(31,28,28,.82); color:rgba(241,238,253,.62); font-size:14px; }
.island svg { height:15px; fill:#fff; margin-right:10px; } .island span { padding:9px 13px; }
.hi { display:inline-flex; align-items:center; height:48px; padding:0 20px; border-radius:999px; background:#fff; color:#1f1c1c; font-weight:600; font-size:14px; box-shadow:0 8px 22px -12px rgba(31,28,28,.55); }
.panel { position:absolute; inset:var(--gap); border-radius:var(--r); overflow:hidden; touch-action:pan-y; background:var(--grey); }
.sc { position:absolute; inset:0; overflow:hidden; }
.sc.grey { background:var(--grey); color:var(--ink); --two:var(--ink); --num:var(--ink); }
.sc.pink { background:var(--pink); color:#fff; --two:var(--navy); --num:var(--navy); }
canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.run { position:absolute; left:56px; right:56px; top:100px; display:flex; align-items:center; gap:18px; font:500 12px/1.4 var(--mono); letter-spacing:.1em; text-transform:uppercase; }
.rule { flex:1; height:1px; background:currentColor; opacity:.32; position:relative; } .rule::after { content:""; position:absolute; left:62%; top:-9px; width:1px; height:19px; background:currentColor; } 
.hl { position:absolute; top:17%; font:800 min(11.2vw, 21vh)/.8 var(--display); letter-spacing:-.06em; white-space:nowrap; }
.hl.a { right:calc(50% + .12em); } .hl.b { left:calc(50% + .12em); font:400 italic 1.035em/.8 var(--serif); font-size:min(11.6vw, 21.7vh); letter-spacing:-.03em; color:var(--two); }
.blurb { position:absolute; left:56px; bottom:38px; font-size:17px; line-height:1.45; max-width:31ch; } .blurb b { font-weight:600; }
.cue { position:absolute; left:50%; bottom:26px; transform:translateX(-50%); z-index:3; display:inline-flex; align-items:center; gap:10px; height:46px; padding:0 7px 0 18px; border-radius:999px; background:#fff; color:#1f1c1c; box-shadow:0 10px 26px -12px rgba(31,28,28,.55); font:500 12px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; pointer-events:none; }
.cue i { width:32px; height:32px; border-radius:50%; background:#1f1c1c; display:grid; place-items:center; } .cue i::after { content:"↓"; font:600 15px/1 var(--text); color:#fff; }
@media (max-width:700px) {
  :root { --gap:10px; --r:22px; }
  .island { font-size:12.5px; padding:5px 5px 5px 10px; gap:0; } .island span { padding:8px 6px; } .island svg { height:13px; margin-right:4px; } .hi { height:44px; padding:0 13px; font-size:13px; }
  .run { left:22px; right:22px; top:84px; gap:10px; } 
  .hl { top:15.5%; font-size:23.5vw; } .hl.a { right:auto; left:20px; } .hl.b { left:22px; top:calc(15.5% + 20vw); font-size:24.5vw; }
  .blurb { left:22px; right:22px; bottom:84px; max-width:none; font-size:16.5px; }
}
</style>
</head>
<body>
<div class="top" aria-hidden="true"><div class="island"><svg viewBox="0 0 44 20"><path d="M0 20L11 0L22 20ZM22 20L33 0L44 20Z"/></svg><span>About</span><span>Work</span><span>Experience</span><span>Art</span><span>Ask</span></div><div class="hi">Say hi</div></div>
<main class="panel" id="panel">
  <div class="sc grey"><canvas class="fx"></canvas><div class="copy"></div></div>
  <div class="sc pink" aria-hidden="true"><canvas class="fx"></canvas><div class="copy"></div></div>
  <canvas class="px"></canvas>
  <div class="cue" aria-hidden="true">Scroll<i></i></div>
</main>
<template id="copy">
  <div class="run"><span>Mayck Cuellar</span><i class="rule"></i><span>Portfolio</span></div>
  <h1 class="hl a">Product</h1><h1 class="hl b">Designer</h1>
  <p class="blurb"><b>10+ years</b> across fintech and consumer products for <b>Novo</b>, <b>Google</b>, <b>Logitech G</b> and <b>AccuWeather</b>, from discovery to launch.</p>
</template>
<script>
(() => {
  const panel = document.getElementById("panel"), pink = panel.querySelector(".sc.pink");
  panel.querySelectorAll(".copy").forEach((c) => c.replaceWith(document.getElementById("copy").content.cloneNode(true)));
  const fxA = panel.querySelector(".grey .fx"), fxB = panel.querySelector(".pink .fx"), pxC = panel.querySelector(".px");
  const a = fxA.getContext("2d"), b = fxB.getContext("2d"), px = pxC.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const COLOURS = ["#ff2e7e", "#1a1466", "#2de2e6", "#ffffff", "#ff2e7e", "#1a1466"];
  const hash = (x, y) => { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

  let W = 0, H = 0, dpr = 1, cell = 26, cols = 0, rows = 0, heat = new Float32Array(0), phone = false;
  let R0 = 200, R1 = 320, grains = [], pyr = { cx: 0, base: 0, a: 0, h: 0, win: 1 };
  const lens = { x: 0, y: 0, tx: 0, ty: 0, seen: 0, on: false, travel: 0 };

  function build() {
    const r = panel.getBoundingClientRect();
    W = r.width; H = r.height; phone = W < 700; dpr = Math.min(window.devicePixelRatio || 1, 1.5);   // the dust is soft enough not to need more
    for (const c of [fxA, fxB, pxC]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    cell = phone ? 17 : Math.max(20, Math.round(W / 54));
    cols = Math.ceil(W / cell); rows = Math.ceil(H / cell); heat = new Float32Array(cols * rows);
    R0 = phone ? W * 0.3 : Math.min(W, H) * 0.25; R1 = R0 * 1.6;
    // One system of grains. Every grain rides one of four slow wavy bands across the panel, and every grain looks the
    // same. Some also own a place on the two pyramids (an M): a core that always holds it, and many more that settle
    // on it only while their band carries them past, then peel off and drift on. So the pyramids are where the dust
    // gathers, not a separate thing on top of it.
    const wp = phone ? W * 0.78 : Math.min(W * 0.31, H * 0.56), pa = wp / 4, ph = wp * 0.6;
    pyr = { cx: W / 2, base: phone ? H * 0.66 : H * 0.74, a: pa, h: ph, win: wp * 0.62 };
    const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]], bands = [[0.16, 0.045, 1.1, 0.4, 0.05], [0.4, 0.06, 0.8, 2.1, 0.07], [0.63, 0.05, 1.3, 4.0, 0.085], [0.86, 0.04, 0.9, 0.9, 0.075]];
    const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
    const place = (i) => {
      const side = i % 2 ? 1 : -1; let x, y, z;
      if (i % 5 < 2) {
        const k = (Math.random() * 4) | 0, c0 = corners[k], c1 = corners[(k + 1) % 4], u = Math.random();
        if (Math.random() < 0.6) { x = c0[0] * pa * (1 - u); z = c0[1] * pa * (1 - u); y = ph * u; }
        else { x = (c0[0] + (c1[0] - c0[0]) * u) * pa; z = (c0[1] + (c1[1] - c0[1]) * u) * pa; y = 0; }
      } else {
        const k = (Math.random() * 4) | 0, c0 = corners[k], c1 = corners[(k + 1) % 4]; let u = Math.random(), v = Math.random(); if (u + v > 1) { u = 1 - u; v = 1 - v; }

      }
      return { x: x + side * pa, y, z };
    };
    const count = phone ? [1100, 1500, 1200] : [2100, 2900, 2400];   // core, passing through, never settling
    grains = [];
    count.forEach((n, kind) => { for (let i = 0; i < n; i++) grains.push({ kind, band: bands[(Math.random() * 4) | 0], u: Math.random(), off: gauss(), speed: 0.004 + 0.008 * Math.random(), ox: 0, oy: 0, seed: Math.random() * 6.283, slot: kind < 2 ? place(i) : null, size: 1.2 + 3.4 * Math.pow(Math.random(), 3), alpha: Math.round((0.5 + 0.5 * Math.pow(Math.random(), 1.2)) * 8) / 8 }); });
    grains.sort((p, q) => p.alpha - q.alpha);
    hold = new Float32Array(grains.length * 4);
    if (!lens.on) { lens.x = lens.tx = W / 2; lens.y = lens.ty = H * 0.52; }
  }

  // The lens follows the pointer (or a finger) and stays where it was left. It never moves by itself.
  const point = (e) => { const r = panel.getBoundingClientRect(); lens.tx = e.clientX - r.left; lens.ty = e.clientY - r.top; lens.seen = performance.now(); lens.on = true; };
  panel.addEventListener("pointermove", point); panel.addEventListener("pointerdown", point);

  let last = performance.now(), t = 0, clip = "", raf = 0;
  let hold = new Float32Array(0);   // grains that are on a pyramid this frame: x, y, radius, alpha
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!reduced) t += dt;
    const ease = 1 - Math.exp(-dt * 9);
    const mx = (lens.tx - lens.x) * ease, my = (lens.ty - lens.y) * ease;
    lens.x += mx; lens.y += my; lens.travel += Math.hypot(mx, my);

    // 1. The lens as cells. Inside it every cell shows; across its edge fewer and fewer do, in the order of a Bayer
    //    matrix; and a cell the lens has just left stays for a moment, so the lens trails a few pixels behind it.
    px.setTransform(dpr, 0, 0, dpr, 0, 0); px.clearRect(0, 0, W, H);
    const tick = Math.floor(lens.travel / (cell * 1.4)); let d = "";   // the coloured pixels reshuffle as the lens travels, and hold still when it does
    for (let y = 0; y < rows; y++) {
      let start = -1;
      for (let x = 0; x <= cols; x++) {
        let show = false;
        if (x < cols) {
          const i = y * cols + x, cxp = (x + 0.5) * cell, cyp = (y + 0.5) * cell;
          const dist = Math.hypot(cxp - lens.x, cyp - lens.y), k = (dist - R0) / (R1 - R0), bay = (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
          const inside = k <= 0 || (k < 1 && bay > k);
          heat[i] = inside ? 1 : Math.max(0, heat[i] - dt * 1.7);
          show = inside || heat[i] > 0.3 + 0.65 * bay;
          // Coloured pixels: thick in the edge, thinning outwards, a few just inside it, and in the trail.
          const h1 = hash(x * 31 + tick * ((i % 7) + 1), y * 17 + ((i * 13) % 5)), h2 = hash(x + 91, y + 57 + tick);
          let p = 0;
          if (!show) p = k < 1 ? 0.5 * (1 - k) + 0.07 : k < 1.75 ? 0.1 * (1.75 - k) / 0.75 : 0, p = Math.max(p, heat[i] * 0.45);
          else if (k > -0.22) p = 0.09;
          if (p && h1 < p) { px.fillStyle = COLOURS[(h2 * COLOURS.length) | 0]; px.fillRect(x * cell, y * cell, cell, cell); }
        }
        if (show && start < 0) start = x;
        else if (!show && start >= 0) { d += `M${start * cell} ${y * cell}h${(x - start) * cell}v${cell}h${-(x - start) * cell}z`; start = -1; }
      }
    }
    if (d !== clip) { clip = d; pink.style.clipPath = d ? `path("${d}")` : "inset(100%)"; pink.style.webkitClipPath = pink.style.clipPath; }

    // 2. The grains. In the grey hero they are all drawn, in ink. In the pink hero only the loose dust is (in white):
    //    where the pyramids stand, the lens shows how they are built instead.
    a.setTransform(dpr, 0, 0, dpr, 0, 0); a.clearRect(0, 0, W, H); a.fillStyle = "#232125";
    const push = R0 * 0.55, reach = R1 * 0.95, k2 = 1 - Math.exp(-dt * 5);
    // The pyramids are seen from slightly above, in perspective. With the lens in the middle they face straight
    // ahead, centred and symmetrical; moving the lens left or right turns them a little that way. Nothing else
    // moves them: not the lens going up or down, and never on their own.
    const yaw = ((lens.x - W / 2) / W) * 0.6, pitch = 0.3;
    const ca = Math.cos(yaw), sa = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch), f = pyr.a * 7;
    const proj = (x, y, z) => { const xr = x * ca + z * sa, zr = -x * sa + z * ca, dep = zr * cp - y * sp, sc = f / (f + dep); return [pyr.cx + xr * sc, pyr.base - (y * cp + zr * sp) * sc, dep]; };
    let alpha = -1, held = 0;
    a.beginPath();
    for (const g of grains) {
      const bd = g.band, u = (g.u + t * g.speed) % 1;
      let x = u * (W + 40) - 20, y = H * (bd[0] + bd[1] * Math.sin(bd[2] * 6.283 * u + bd[3] + t * 0.12) + 0.02 * Math.sin(5.1 * 6.283 * u + bd[3] * 2) + g.off * bd[4] * 0.95), m = 0;
      if (g.slot) {
        const q0 = proj(g.slot.x, g.slot.y, g.slot.z), sx = q0[0] + Math.sin(t * 0.55 + g.seed) * 1.6, sy = q0[1] + Math.cos(t * 0.47 + g.seed) * 1.6;
        if (g.kind === 0) m = 1;
        else { const q = Math.min(1, Math.max(0, (pyr.win - Math.abs(x - sx)) / (pyr.win * 0.3))); m = q * q * (3 - 2 * q); }   // settles while its band passes the pyramids
        x += (sx - x) * m; y += (sy - y) * m;
      }
      const dx = x - lens.x, dy = y - lens.y, dist = Math.hypot(dx, dy) + 0.001, fo = push * Math.exp(-(dist / reach) * (dist / reach)) * (1 - 0.88 * m);
      g.ox += (dx / dist * fo - g.ox) * k2; g.oy += (dy / dist * fo - g.oy) * k2;
      const X = x + g.ox, Y = y + g.oy, r = g.size;
      if (m > 0.5) { hold[held++] = X; hold[held++] = Y; hold[held++] = r; hold[held++] = g.alpha; continue; }   // on a pyramid: grey hero only
      if (g.alpha !== alpha) { a.fill(); a.beginPath(); alpha = g.alpha; a.globalAlpha = alpha; }
      if (r < 1.6) a.rect(X, Y, r, r); else { a.moveTo(X + r * 0.6, Y); a.arc(X, Y, r * 0.6, 0, 6.283); }
    }
    a.fill();
    b.setTransform(1, 0, 0, 1, 0, 0); b.globalAlpha = 1; b.globalCompositeOperation = "copy"; b.drawImage(fxA, 0, 0);
    b.globalCompositeOperation = "source-in"; b.fillStyle = "#fff"; b.fillRect(0, 0, fxB.width, fxB.height);
    b.globalCompositeOperation = "source-over";
    alpha = -1; a.beginPath();
    for (let i = 0; i < held; i += 4) {
      if (hold[i + 3] !== alpha) { a.fill(); a.beginPath(); alpha = hold[i + 3]; a.globalAlpha = alpha; }
      const X = hold[i], Y = hold[i + 1], r = hold[i + 2];
      if (r < 1.6) a.rect(X, Y, r, r); else { a.moveTo(X + r * 0.6, Y); a.arc(X, Y, r * 0.6, 0, 6.283); }
    }
    a.fill(); a.globalAlpha = 1;

    // 3. The blueprint of the M, drawn in the pink hero as a drawing in space: a floor grid in perspective, the two
    //    pyramids as wireframes (hidden edges dashed, faces lightly tinted), their heights and base diagonals, the
    //    three measurements laid along the three axes, and the axes themselves.
    b.setTransform(dpr, 0, 0, dpr, 0, 0);
    const A = pyr.a, Hh = pyr.h, gap = A * 0.42, fs = phone ? 10 : 11;
    const seg = (p0, p1) => { b.moveTo(p0[0], p0[1]); b.lineTo(p1[0], p1[1]); }, L = (x0, y0, z0, x1, y1, z1) => seg(proj(x0, y0, z0), proj(x1, y1, z1));
    const sq = (p0, r = 3.5) => { b.fillRect(p0[0] - r, p0[1] - r, r * 2, r * 2); };
    b.setLineDash([]); b.lineWidth = 1; b.strokeStyle = "rgba(255,255,255,.2)"; b.beginPath();
    const gx = A * 3.5, gz = A * 2.5, st = A / 2;
    for (let x0 = -gx; x0 <= gx + 0.01; x0 += st) L(x0, 0, -gz, x0, 0, gz);
    for (let z0 = -gz; z0 <= gz + 0.01; z0 += st) L(-gx, 0, z0, gx, 0, z0);
    b.stroke();
    for (const sd of [-1, 1]) {
      const cs = [[-1, -1], [1, -1], [1, 1], [-1, 1]], base = cs.map((c) => proj(sd * A + c[0] * A, 0, c[1] * A)), top = proj(sd * A, Hh, 0), foot = proj(sd * A, 0, 0);
      b.fillStyle = "rgba(255,255,255,.07)";
      base.forEach((p0, i) => { const p1 = base[(i + 1) % 4]; b.beginPath(); b.moveTo(p0[0], p0[1]); b.lineTo(p1[0], p1[1]); b.lineTo(top[0], top[1]); b.closePath(); b.fill(); });
      // construction lines: the height and the base's diagonals
      b.beginPath(); b.setLineDash([2, 4]); b.strokeStyle = "rgba(255,255,255,.6)"; b.lineWidth = 1; seg(top, foot); seg(base[0], base[2]); seg(base[1], base[3]); b.stroke();
      const far = Math.max(...base.map((p0) => p0[2])), edges = base.map((p0, i) => [p0, base[(i + 1) % 4], p0[2] === far || base[(i + 1) % 4][2] === far]).concat(base.map((p0) => [p0, top, p0[2] === far]));
      for (const hidden of [true, false]) {   // edges that meet the far corner are behind the solid: dashed and faint
        b.beginPath(); b.setLineDash(hidden ? [4, 4] : []); b.strokeStyle = hidden ? "rgba(255,255,255,.5)" : "#fff"; b.lineWidth = hidden ? 1 : 1.7;
        edges.forEach((e) => { if (e[2] === hidden) seg(e[0], e[1]); });
        b.stroke();
      }
      b.setLineDash([]); b.fillStyle = "#fff"; base.forEach((p0) => sq(p0)); sq(top, 4.5); sq(foot, 2.5);
      // a right-angle mark where the height meets the floor
      const m = A * 0.16; b.beginPath(); b.strokeStyle = "rgba(255,255,255,.8)"; b.lineWidth = 1; L(sd * A + m, 0, 0, sd * A + m, m, 0); L(sd * A + m, m, 0, sd * A, m, 0); b.stroke();
    }
    // Measurements, each along its own axis, with end ticks
    b.strokeStyle = "#fff"; b.fillStyle = "#fff"; b.lineWidth = 1; b.setLineDash([]); b.font = `500 ${fs}px "Geist Mono", monospace`; b.textBaseline = "middle"; b.textAlign = "center";
    const tk = A * 0.09, zf = -A - gap, xr0 = 2 * A + gap, xl = -2 * A - gap;
    b.beginPath();
    L(-2 * A, 0, zf, 2 * A, 0, zf); L(-2 * A, 0, zf - tk, -2 * A, 0, zf + tk); L(2 * A, 0, zf - tk, 2 * A, 0, zf + tk);   // width
    L(xr0, 0, -A, xr0, 0, A); L(xr0 - tk, 0, -A, xr0 + tk, 0, -A); L(xr0 - tk, 0, A, xr0 + tk, 0, A);                   // depth
    L(xl, 0, -A, xl, Hh, -A); L(xl - tk, 0, -A, xl + tk, 0, -A); L(xl - tk, Hh, -A, xl + tk, Hh, -A);                   // height
    b.stroke();
    b.setLineDash([2, 4]); b.strokeStyle = "rgba(255,255,255,.55)"; b.beginPath();
    L(-2 * A, 0, -A, -2 * A, 0, zf); L(2 * A, 0, -A, 2 * A, 0, zf); L(2 * A, 0, -A, xr0, 0, -A); L(2 * A, 0, A, xr0, 0, A); L(-2 * A, 0, -A, xl, 0, -A); L(-A, Hh, 0, xl, Hh, -A);
    b.stroke(); b.setLineDash([]);
    const tag = (p0, txt, dx = 0, dy = 0) => { const w = b.measureText(txt).width + 10; b.fillStyle = "#ff2e7e"; b.fillRect(p0[0] + dx - w / 2, p0[1] + dy - fs * 0.8, w, fs * 1.6); b.fillStyle = "#fff"; b.fillText(txt, p0[0] + dx, p0[1] + dy + 0.5); };
    tag(proj(0, 0, zf), `W ${Math.round(4 * A)}`); tag(proj(xr0, 0, 0), `D ${Math.round(2 * A)}`); tag(proj(xl, Hh / 2, -A), `H ${Math.round(Hh)}`);
    // The axes, at the near left corner of the floor
    const o3 = [-gx, 0, -gz], al = A * 0.75, axes = [["X", al, 0, 0, "#2de2e6"], ["Y", 0, al, 0, "#fff"], ["Z", 0, 0, al, "#1a1466"]];
